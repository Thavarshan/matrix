name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, php: '8.3' }
          - { os: ubuntu-latest, php: '8.4' }
          - { os: ubuntu-latest, php: '8.5' }
          - { os: windows-latest, php: '8.5' }
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer test

  lowest:
    name: PHP 8.3 lowest dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer update --prefer-lowest --prefer-dist --no-interaction
      - run: composer test

  package:
    name: Composer validation and archive smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-dev --no-interaction --no-progress --prefer-dist
      - run: composer audit --no-interaction
      - run: composer archive --no-interaction --format=tar
      - name: Install and smoke test the generated archive as a consumer
        shell: bash
        run: |
          archive=$(find . -maxdepth 1 -name 'jerome-matrix-*.tar' -print -quit)
          test -n "$archive"
          mkdir -p "$RUNNER_TEMP/matrix-package" "$RUNNER_TEMP/matrix-consumer"
          tar -xf "$archive" -C "$RUNNER_TEMP/matrix-package"
          for required in composer.json LICENSE README.md src/Matrix/Async.php src/Matrix/Support/helpers.php; do
            test -f "$RUNNER_TEMP/matrix-package/$required"
          done
          cat > "$RUNNER_TEMP/matrix-consumer/composer.json" <<'JSON'
          {
            "repositories": [{"type": "path", "url": "../matrix-package", "options": {"symlink": false}}],
            "require": {"jerome/matrix": "dev-main"}
          }
          JSON
          cd "$RUNNER_TEMP/matrix-consumer"
          composer install --no-dev --no-interaction --no-progress
          php -r 'require "vendor/autoload.php"; $value = Matrix\Support\await(Matrix\Support\async(static fn () => "ok")); if ($value !== "ok") { exit(1); } $mapped = Matrix\Support\await(Matrix\Support\map([1, 2], static fn (int $n): int => $n * 2, 1)); if ($mapped !== [2, 4]) { exit(1); } try { Matrix\Support\await(Matrix\Support\timeout(Matrix\Support\delay(1), 0.001)); exit(1); } catch (Matrix\Exceptions\TimeoutException) {}'
